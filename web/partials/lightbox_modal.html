<!-- Image Lightbox Modal Overlay -->
<div id="imageLightboxModal" class="lightbox-modal">
  <div class="lightbox-img-container">
    <img id="lightboxImage" src="" alt="Full Resolution Diagram Figure" class="lightbox-img" />
  </div>
  <div class="lightbox-controls">
    <a id="downloadImageBtn" href="#" download="diagram.png" target="_blank" class="lightbox-btn">⬇ Download High-Res PNG</a>
    <button id="closeLightboxBtn" class="lightbox-btn" style="background: var(--accent-rose); border-color: var(--accent-rose);">✕ Close (Esc)</button>
  </div>
</div>
