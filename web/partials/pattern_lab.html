<div id="patternTabSection" class="tab-content flex-1 flex flex-col h-full overflow-y-auto custom-scrollbar pr-2" style="display: none;">
  <div class="mb-5">
    <h2 class="text-xl text-slate-100 font-bold tracking-tight">Pattern Lab</h2>
    <p class="text-xs text-slate-400 mt-1">Analyze indexed examples, save a blueprint, and generate an original paper with solutions.</p>
  </div>

  <div class="bg-slate-900/80 rounded-xl border border-slate-700/60 p-5 mb-4">
    <h3 class="text-sm font-bold text-indigo-300 mb-3">1. Analyze paper pattern</h3>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
      <input id="patternNameInput" class="filter-select" value="Navodaya Pattern" placeholder="Pattern name" />
      <input id="patternClassInput" class="filter-select" value="10" placeholder="Class" />
      <input id="patternSubjectInput" class="filter-select" value="mathematics" placeholder="Subject" />
    </div>
    <button id="analyzePatternBtn" class="mt-4 px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-sm font-semibold">Analyze and Save Blueprint</button>
    <div id="patternAnalysisResult" class="mt-3 text-xs text-slate-300"></div>
  </div>

  <div class="bg-slate-900/80 rounded-xl border border-slate-700/60 p-5 mb-4">
    <h3 class="text-sm font-bold text-emerald-300 mb-3">2. Generate original paper</h3>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
      <input id="patternTopicInput" class="filter-select" placeholder="Topic (optional)" />
      <input id="patternDifficultyInput" class="filter-select" placeholder="Difficulty (optional)" />
      <input id="patternCountInput" class="filter-select" type="number" min="1" max="50" value="5" placeholder="Question count" />
    </div>
    <button id="generatePatternPaperBtn" class="mt-4 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-semibold" disabled>Generate Paper</button>
    <div id="generatedPatternPaperResult" class="mt-4"></div>
  </div>
</div>
