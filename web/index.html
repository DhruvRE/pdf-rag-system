<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>EduBank Pro - Question Bank RAG System</title>

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <!-- MathJax 3 & Marked Libraries for LaTeX & Markdown Rendering -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <!-- Master Stylesheet Importing Modular CSS Sections -->
  <link rel="stylesheet" href="style.css?v=modular_v3">
</head>

<body class="bg-slate-950 text-slate-100 font-sans overflow-hidden flex h-screen">

  <!-- Sidebar Partial Section -->
  <div data-partial="partials/sidebar.html"></div>

  <!-- Main Workspace Area -->
  <div class="flex-1 flex flex-col ml-64 overflow-hidden relative">

    <!-- Top Header Navigation Partial -->
    <div data-partial="partials/header.html"></div>

    <!-- Main Container Canvas -->
    <main class="main-content-canvas flex-1 overflow-hidden flex gap-6 p-6">

      <!-- Left Filter Sidebar Partial -->
      <div data-partial="partials/filters.html"></div>

      <!-- Tab Content Canvas -->
      <section class="flex-1 flex flex-col h-full overflow-hidden">
        <!-- Question Search Tab Partial -->
        <div data-partial="partials/question_search.html"></div>

        <!-- Drafts Queue Tab Partial -->
        <div data-partial="partials/drafts_queue.html"></div>

        <!-- Deduplication Tab Partial -->
        <div data-partial="partials/dedup_queue.html"></div>

        <!-- Upload PDF Tab Partial -->
        <div data-partial="partials/upload_pdf.html"></div>
      </section>
    </main>
  </div>

  <!-- Image Lightbox Modal Partial -->
  <div data-partial="partials/lightbox_modal.html"></div>

  <!-- Main Frontend JavaScript Logic -->
  <script src="app.js?v=modular_v4"></script>
</body>
</html>
